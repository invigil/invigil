name: Nightly smoke — published artifacts

# S3: Invigil's own nightly smoke test. Calls the reusable Cold-Start Gate (stranger-gate.yml) to
# boot the published PyPI package and Docker image on a clean runner daily.
# This is exactly the "smoke-published" check that invigil score looks for.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: read

jobs:
  stranger:
    name: Boot published invigil from a cold start
    # Self-referencing pins track a *release tag* SHA, never whatever `main` happened to
    # be that morning: `actions-sha-pinned` reads the trailing comment, so pinning a bot
    # commit and labelling it `# v1` is false supply-chain evidence about ourselves.
    uses: invigil/invigil/.github/workflows/stranger-gate.yml@7f31330715bb7e42f26032ce3e921fcf78d4acea  # v1.7.1
    with:
      path: "."
